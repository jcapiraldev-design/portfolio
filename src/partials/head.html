<!-- Shared <head> for every page. scripts/build.js fills in the {{placeholders}}
     from the settings at the top of each file in src/pages/. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{#canonical}}<link rel="canonical" href="{{site}}{{path}}">
{{/canonical}}<meta name="author" content="Jasper Capiral">
{{#robots}}<meta name="robots" content="{{robots}}">
{{/robots}}<meta name="theme-color" content="#F5F7FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12172A" media="(prefers-color-scheme: dark)">

<!-- Icons -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/site/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/site/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/images/site/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
{{#social}}
<!-- Social sharing (Facebook, LinkedIn, Messenger, Chatwork, Slack, X) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Jasper Capiral">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{site}}{{path}}">
<meta property="og:image" content="{{site}}/assets/images/site/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Jasper Capiral, PHP Developer: I build websites end to end, from design to deployment.">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{site}}/assets/images/site/og-image.png">
{{/social}}
<!-- Fonts and styles (one stylesheet for the whole site) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">

<!-- Scripts: ES modules run after the page has loaded. main.js runs on every page;
     a page can add its own module with "scripts:" in its settings. -->
<script type="module" src="/assets/js/main.js"></script>
{{scripts}}<script defer src="/_vercel/insights/script.js"></script>
{{extra}}
